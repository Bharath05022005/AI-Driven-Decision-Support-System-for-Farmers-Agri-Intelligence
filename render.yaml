services:
  # Backend Service
  - type: web
    name: agri-backend
    runtime: docker
    dockerContext: ./server_backend
    dockerfilePath: ./server_backend/Dockerfile
    plan: free
    envVars:
      - key: MONGODB_CONNECTION_STRING
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
    dockerBuildArgs:
      - key: HF_TOKEN
        value: $HF_TOKEN

  # Frontend Service
  - type: web
    name: agri-frontend
    runtime: docker
    dockerContext: ./client_frontend
    dockerfilePath: ./client_frontend/Dockerfile
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          name: agri-backend
          type: web
          property: host